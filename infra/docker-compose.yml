# n8n + Caddy (HTTPS automático con Let's Encrypt)
# Uso: cp .env.example .env  →  edita DOMINIO  →  docker compose up -d
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      - DOMINIO=${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=${DOMINIO}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${DOMINIO}/
      - N8N_PROXY_HOPS=1
      - GENERIC_TIMEZONE=${TZ}
      - TZ=${TZ}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
  caddy_data:
  caddy_config:
